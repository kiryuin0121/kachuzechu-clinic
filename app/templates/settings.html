{% extends "base.html" %}
{% block title %}アカウント設定 | 滑舌クリニック{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">アカウント設定</h1>

<div class="bg-white border border-gray-200 rounded-lg p-6 mb-6">
    <p class="text-sm text-gray-500">現在のメールアドレス</p>
    <p class="text-lg font-semibold">{{ user.email }}</p>
</div>

<div class="bg-white border border-gray-200 rounded-lg p-6 mb-6">
    <h2 class="text-lg font-bold mb-4">パスワード変更</h2>
    <form method="post" action="{{ url_for('auth.change_password') }}" class="space-y-4 max-w-sm">
        <div>
            <label class="block text-sm text-gray-600 mb-1" for="current_password">現在のパスワード</label>
            <input type="password" id="current_password" name="current_password" required
                   class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm text-gray-600 mb-1" for="new_password">新しいパスワード（8文字以上）</label>
            <input type="password" id="new_password" name="new_password" required minlength="8"
                   class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm text-gray-600 mb-1" for="confirm_new_password">新しいパスワード（確認）</label>
            <input type="password" id="confirm_new_password" name="confirm_new_password" required minlength="8"
                   class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <button type="submit" class="bg-indigo-600 text-white rounded px-4 py-2 text-sm hover:bg-indigo-700">
            パスワードを変更する
        </button>
    </form>
</div>

<div class="bg-white border border-gray-200 rounded-lg p-6">
    <h2 class="text-lg font-bold mb-4">メールアドレス変更</h2>
    <form method="post" action="{{ url_for('auth.request_email_change') }}" class="space-y-4 max-w-sm">
        <div>
            <label class="block text-sm text-gray-600 mb-1" for="current_password_for_email">現在のパスワード</label>
            <input type="password" id="current_password_for_email" name="current_password" required
                   class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm text-gray-600 mb-1" for="new_email">新しいメールアドレス</label>
            <input type="email" id="new_email" name="new_email" required
                   class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <button type="submit" class="bg-indigo-600 text-white rounded px-4 py-2 text-sm hover:bg-indigo-700">
            確認メールを送信する
        </button>
    </form>
    <p class="text-xs text-gray-400 mt-3">
        新しいメールアドレスに確認メールが届きます。メール内のリンクをクリックすると変更が確定します。
    </p>
</div>
{% endblock %}
