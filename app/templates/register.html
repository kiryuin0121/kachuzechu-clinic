{% extends "base.html" %}
{% block title %}会員登録 | 滑舌クリニック{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto bg-white border border-gray-200 rounded-lg p-6">
    <h1 class="text-xl font-bold mb-4">会員登録</h1>
    <form method="post" action="{{ url_for('auth.register') }}" class="space-y-4">
        <div>
            <label class="block text-sm text-gray-600 mb-1" for="email">メールアドレス</label>
            <input type="email" id="email" name="email" required value="{{ email or '' }}"
                   class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm text-gray-600 mb-1" for="password">パスワード（8文字以上）</label>
            <input type="password" id="password" name="password" required minlength="8"
                   class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm text-gray-600 mb-1" for="confirm_password">パスワード（確認）</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="8"
                   class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white rounded py-2 text-sm hover:bg-indigo-700">
            登録する
        </button>
    </form>
    <p class="text-sm text-gray-500 mt-4">
        登録後、確認メールが届きます。メール内のリンクをクリックして認証を完了してください。
    </p>
    <p class="text-sm text-gray-500 mt-4">
        既にアカウントをお持ちの方は
        <a href="{{ url_for('auth.login') }}" class="text-indigo-600 hover:underline">ログイン</a>
    </p>
</div>
{% endblock %}
