{% extends "base.html" %}
{% block title %}エラー | 滑舌クリニック{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white border border-gray-200 rounded-lg p-6 text-center">
    <h1 class="text-lg font-bold mb-2">エラーが発生しました（{{ status_code }}）</h1>
    <p class="text-sm text-gray-600 mb-6">{{ message }}</p>
    <a href="{{ url_for('home.index') }}" class="text-indigo-600 hover:underline text-sm">ホームへ戻る</a>
</div>
{% endblock %}
